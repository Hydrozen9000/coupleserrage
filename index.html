<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Couple de serrage des vis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="carte">
    <h1>Calcul du couple de serrage d'une vis</h1>
    <p class="intro">Choisissez le type de filetage, le diamètre et la classe de qualité.</p>

    <div class="cadre cadre-bleu">
      <label for="famille">Type de filetage</label>
      <select id="famille">
        <option value="metrique-normal">Métrique pas normal (ISO)</option>
        <option value="metrique-fin">Métrique pas fin (ISO)</option>
        <option value="unc">Pouce pas normal (UNC)</option>
        <option value="unf">Pouce pas fin (UNF)</option>
      </select>
    </div>

    <div class="cadre cadre-orange">
      <label for="diametre">Diamètre</label>
      <select id="diametre"></select>
    </div>

    <div class="cadre cadre-violet">
      <label for="classe">Classe de qualité</label>
      <select id="classe"></select>
    </div>

    <div class="cadre cadre-rose">
      <label for="frottement">État des surfaces (coefficient de frottement)</label>
      <select id="frottement">
        <option value="0.20" selected>À sec (K = 0,20)</option>
        <option value="0.15">Légèrement huilé (K = 0,15)</option>
        <option value="0.12">Graissé (K = 0,12)</option>
      </select>
    </div>

    <button id="calculer">Calculer</button>

    <div id="resultat" class="resultat" hidden>
      <p class="couple"><span id="couple-dan">0</span> daN·m</p>
      <p class="couple-nm"><span id="couple-nm">0</span> N·m</p>
      <p class="detail" id="detail"></p>
    </div>

    <p class="avertissement">
      Valeur indicative (serrage à 75 % de la contrainte d'épreuve). 1 daN·m = 10 N·m.
      Pour une pièce de sécurité, vérifiez avec la documentation du fabricant.
    </p>
  </main>

  <script src="script.js"></script>
</body>
</html>
